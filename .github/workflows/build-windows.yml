# Reusable Windows package build. Publication belongs to the coordinator.
name: build-windows
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      commit:
        required: true
        type: string
permissions:
  contents: read

env:
  LLVM_MINGW_VERSION: '20260922'
  LLVM_MINGW_SHA256: e3ad77d117a4bea19a7a3b333341824d79a5a371004a10e25b8504e7b3047666

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain cache
        id: cache
        uses: actions/cache@v4
        with:
          path: llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-x86_64

      - name: Download LLVM-MinGW
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$name.zip" -OutFile llvm-mingw.zip
          $hash = (Get-FileHash llvm-mingw.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:LLVM_MINGW_SHA256) { throw "llvm-mingw.zip sha256 $hash, expected $env:LLVM_MINGW_SHA256" }
          Expand-Archive llvm-mingw.zip -DestinationPath .
          Rename-Item $name llvm-mingw

      - name: Tools
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y | Out-Null }
          cmake --version
          ninja --version
          (Get-Command ninja).Source

      # a failing step's last lines become an error annotation, readable without signing in
      - name: Configure
        shell: pwsh
        run: |
          # every -D quoted: PowerShell splits an unquoted -DX=a.b at the dot
          $ninja = (Get-Command ninja).Source
          $out = & cmake -S . -B build -G Ninja "-DCMAKE_MAKE_PROGRAM=$ninja" "-DCMAKE_BUILD_TYPE=Release" "-DXBE_RELEASE=ON" `
            "-DXBE_RELEASE_VERSION=${{ inputs.version }}" `
            "-DCMAKE_TOOLCHAIN_FILE=cmake/llvm-mingw.cmake" "-DLLVM_MINGW=$env:GITHUB_WORKSPACE/llvm-mingw" `
            "-DCMAKE_C_FLAGS=-march=x86-64-v2" "-DCMAKE_CXX_FLAGS=-march=x86-64-v2" 2>&1
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code) { "::error title=Configure::$((($out | Select-Object -Last 30) -join '%0A'))"; exit $code }

      - name: Build and package
        shell: pwsh
        run: |
          $out = & cmake --build build --target package_GenmaOnimusha 2>&1
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code) { "::error title=Build::$((($out | Where-Object { $_ -match 'error|FAILED' } | Select-Object -First 30) -join '%0A'))"; exit $code }

      - name: Modern controls regression tests
        shell: pwsh
        run: |
          $cxx = "$env:GITHUB_WORKSPACE/llvm-mingw/bin/clang++.exe"
          & $cxx -std=c++20 -static -Wall -Wextra tools/test_modern_controls.cpp -o build/test_modern_controls.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./build/test_modern_controls.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $cxx -std=c++20 -static -Wall -Wextra -Isdk/runtime -Ibuild/GenmaOnimusha_symbols tools/test_modern_controls_hook.cpp -o build/test_modern_controls_hook.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./build/test_modern_controls_hook.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Frame timing and disk cache regression tests
        shell: pwsh
        run: |
          $cxx = "$env:GITHUB_WORKSPACE/llvm-mingw/bin/clang++.exe"
          foreach ($test in @('test_frame_clock', 'test_disk_cache')) {
            & $cxx -std=c++20 -static -UNDEBUG -Wall -Wextra -Isdk/runtime "tools/$test.cpp" -o "build/$test.exe"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & "./build/$test.exe"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Updater regression tests
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File tools/test_updater.ps1 -Launcher "$env:GITHUB_WORKSPACE/build/release/GenmaOnimusha.exe" `
            -FixtureVersion '${{ inputs.version }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Zip
        shell: pwsh
        run: |
          $zip = "GenmaOnimusha-${{ inputs.version }}-win64.zip"
          Push-Location build/release
          7z a -tzip -mx=9 "$env:GITHUB_WORKSPACE/$zip" GenmaOnimusha | Out-Null
          Pop-Location
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Package metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          $file = Get-Item $env:ZIP
          @{schema=1; platform='win64'; version=$env:RELEASE_VERSION; commit=$env:RELEASE_COMMIT; file=$file.Name; size=$file.Length; sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} | ConvertTo-Json | Set-Content windows-manifest.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            ${{ env.ZIP }}
            windows-manifest.json
