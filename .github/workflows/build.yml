name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [both, windows, linux]
        default: both
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          version=os.environ['REF_NAME'] if os.environ['REF_TYPE']=='tag' else 'dev-'+commit[:8]
          if not re.fullmatch(r'(v[0-9]+\.[0-9]+\.[0-9]+(?:[.-][A-Za-z0-9.-]+)?|dev-[a-f0-9]{8})',version):
              raise SystemExit('Invalid release version')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('version='+version+'\ncommit='+commit+'\n')
          PY
  windows:
    needs: metadata
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux'
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      commit: ${{ needs.metadata.outputs.commit }}
  linux:
    needs: metadata
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      commit: ${{ needs.metadata.outputs.commit }}
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify and publish both platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: python3 tools/publish_release.py --directory release-assets --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
